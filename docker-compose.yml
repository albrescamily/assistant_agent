services:
  llm:
    build:
      context: ./llm
      args:
        MODEL: ${MODEL}
    env_file:
      - ./llm/.env
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:                        
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  agent:
    build:
      context: ./agent
    env_file:
      - ./agent/.env
    environment:
      - MODEL=${MODEL}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - agent_memory:/app/memory_data
    depends_on:
      llm:
        condition: service_healthy
      pg-database:
        condition: service_healthy

  pg-database:
    build:
      context: ./db
    env_file:
      - ./db/.env
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./data:/data:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ollama_data:
  pg_data:
  agent_memory:
services:
  llm:
    build:
      context: ./llm
      args:
        MODEL: ${MODEL}
    env_file:
      - ./llm/.env
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:                        
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  agent:
    build:
      context: ./agent
    env_file:
      - ./agent/.env
    environment:
      - MODEL=${MODEL}
      - PHOENIX_COLLECTOR_ENDPOINT=http://phoenix:6006
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - agent_memory:/app/memory_data
    depends_on:
      llm:
        condition: service_healthy
      phoenix:
        condition: service_started
      pg-database:
        condition: service_healthy

  embedding:
    image: ghcr.io/ggml-org/llama.cpp:server  # CPU-only build
    command: -hf gpustack/bge-m3-GGUF:Q8_0 --embeddings --pooling cls --host 0.0.0.0 --port 8080
    environment:
      - LLAMA_CACHE=/models  # where -hf saves the downloaded model
    ports:
      - "8080:8080"
    volumes:
      - embedding_data:/models  # model download cache, survives restarts

  phoenix:
    image: arizephoenix/phoenix:latest
    environment:
      - PHOENIX_ENABLE_AUTH=false  # local only: no login, agent sends traces without an API key
    ports:
      - "6006:6006"  # web UI + receives the traces

  pg-database:
    build:
      context: ./db
    env_file:
      - ./db/.env
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./data:/data:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ollama_data:
  pg_data:
  agent_memory:
  embedding_data: